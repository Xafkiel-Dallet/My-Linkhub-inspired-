<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Linkhub</title>
  <link rel="stylesheet" type="text/css" href="Style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>
  
  <!-- 1. I-LABAS ANG NAVIGATION BAR DITO (Para laging nasa taas) -->
  <nav class="navigation fade-in">
    <div class="nav-title">Connect with me</div>
    <ul class="my-links">
      <li><a href="https://github.com/Xafkiel-Dallet" target="_blank"><i class="fab fa-github"></i></a></li>
    </ul>
  </nav>

  <!-- 2. CARD WRAPPER (Profile, links, at about lang ang nakapaloob) -->
  <main class="main-card">
    <figure class="profile-container fade-in">
      <img src="profile.jpg" alt="Profile">
      <figcaption class="figtitle">Aspiring Web Developer</figcaption>
    </figure>

    <div class="content fade-in">
      <h4>Hello! My name is Russel and below are my links</h4>
    </div>

    <div class="button-container fade-in">
      <a id="facebookBtn" href="https://www.facebook.com/share/198YzSfwGT/" target="_blank">Facebook</a>
      <a id="twitterBtn" href="https://x.com/Default404_r" target="_blank">Twitter</a>
      <a id="instagramBtn" href="https://www.instagram.com/mrch.icken30" target="_blank">Instagram</a>
      <a id="discordBtn" href="https://discordapp.com/users/userid/827791231266455583" target="_blank">Discord</a>
      <a id="telegramBtn" href="https://t.me/OxidenUss" target="_blank">Telegram</a>
    </div>

    <!-- P tag Button -->
    <p class="nav-item fade-in" id="aboutBtn">About this account</p>
  </main>

  <!-- POPUP DRAWER MODAL -->
  <div id="aboutDrawer" class="about-drawer">
    ...
  </div>

  <script src="js.js"></script>
</body>

</html>
